version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secret-key-change-me-in-env
      - DATABASE_PATH=/app/data/fitness_tracker.db
    volumes:
      - fitness_data:/app/data

volumes:
  fitness_data:
